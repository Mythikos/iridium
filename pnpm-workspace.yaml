packages:
  - 'apps/*'
  - 'packages/*'
  - 'tooling/*'
  # Spike harnesses whose dependency set differs from any product package's (12-milestones.md D12-5:
  # spike code never becomes product code). Each is a leaf tagged `spike`; `turbo boundaries` lets
  # nothing depend on one.
  - 'spikes/*'
  # Inert shared security corpus: browser/iso tests never depend on the Node testkit runtime.
  - 'packages/testkit/src/fixtures/hostile'

