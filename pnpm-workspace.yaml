# Dependency policy (13-decision-log.md A1; 12-milestones.md section 4.2 step 3)
# Named catalogs: the one place a workspace may pin a version the default catalog does not carry.
# `mutation` exists because spike S5 proved Stryker 10's vitest-runner cannot discover tests under
# Vitest 5.0.0; tooling/mutation runs on the V4 line, every other test project stays on 5.0.0
# (docs/spikes/S05-stryker-vitest5.md, "Fallback executed").
catalogs:
  mutation:
    vitest: 4.1.11
    # The Vitest 4 companions the lane declares for peer resolution only: pnpm pairs a Vitest
    # optional peer with whichever version the workspace graph holds, and the graph holds these at
    # 5.0.0 (the root's coverage provider, @iridium/ui's browser provider). Declaring the 4.1.11
    # family here keeps every pairing inside one Vitest line; Stryker loads none of them.
    '@vitest/browser': 4.1.11
    '@vitest/browser-playwright': 4.1.11
    '@vitest/coverage-v8': 4.1.11
    '@vitest/ui': 4.1.11

catalogMode: strict
saveExact: true
engineStrict: true
# Install dependencies explicitly before running workspace tasks.
verifyDepsBeforeRun: error
minimumReleaseAge: 4320
# Bootstrap exceptions expired on 2026-09-14; every pin now observes the same release-age floor.
minimumReleaseAgeExclude: []
trustPolicy: no-downgrade
# Exact old versions that no-downgrade flags because a later version gained provenance and these predate it.
# Every entry is a pin, never a range, and is reviewed when its dependent moves (13-decision-log.md A1).
trustPolicyExclude:
  - 'semver@5.7.2'
  - 'semver@6.3.1'
allowBuilds:
  electron: true
  lefthook: true
  '@node-rs/argon2': true
  # esbuild bundles the k6 load scripts (spike S6); its install script checks the platform binary
  # package it resolved and downloads one only when that package is missing.
  esbuild: true
  # Transitive packages that ship install scripts the product does not need: denied explicitly so
  # pnpm 12 never prompts and a new script-bearing dependency fails the install until it is reviewed.
  cpu-features: false
  electron-winstaller: false
  msw: false
  protobufjs: false
  ssh2: false
strictPeerDependencies: true
dedupePeerDependents: true
peerDependencyRules:
  allowedVersions:
    # openapi-typescript 7.13.0 declares `typescript: ^5.x` and runs on the TypeScript 6 JavaScript
    # compiler API, which is the 5.x API with deprecations; tooling/api-codegen aliases it to
    # @typescript/typescript6 (A2, R-T10). Scoped to that one parent: nothing else may accept TS 6.
    'openapi-typescript>typescript': '6'
publicHoistPattern: []

# One module instance each (A14): the whole closure resolves to the catalog version
overrides:
  yjs: 'catalog:'
  # lowlight must execute the same pinned engine that supplies the registered language grammars.
  highlight.js: 'catalog:'
  # One Node type environment: transitive `@types/*` packages pull `@types/node@*`, which would
  # otherwise resolve to whatever is newest and make `pnpm dedupe --check` chase it (Node 24 is the
  # only runtime, A4).
  '@types/node': 'catalog:'
  # Test-only libraries other test libraries depend on: `@fast-check/vitest` carries its own
  # `fast-check` range and `vitest-axe` its own `axe-core` range; the override makes the catalog pin
  # the copy the specs import, so one arbitrary and one rule set exist per run.
  'fast-check': 'catalog:'
  'axe-core': 'catalog:'
  lib0: 'catalog:'
  y-protocols: 'catalog:'
  '@codemirror/state': 'catalog:'
  '@codemirror/view': 'catalog:'
patchedDependencies:
  markdown-it@15.0.2: patches/markdown-it@15.0.2.patch
  '@fastify/websocket@11.3.0': patches/@fastify__websocket@11.3.0.patch
  '@hocuspocus/provider@4.7.0': patches/@hocuspocus__provider@4.7.0.patch
  '@hocuspocus/server@4.7.0': patches/@hocuspocus__server@4.7.0.patch
  ssh-remote-port-forward@1.0.4: patches/ssh-remote-port-forward@1.0.4.patch
