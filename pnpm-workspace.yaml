# Dependency policy (13-decision-log.md A1; 12-milestones.md section 4.2 step 3)
catalogMode: strict
saveExact: true
engineStrict: true
minimumReleaseAge: 4320
# The plan pins releases younger than three days at bootstrap time (2026-09-13). Each entry is an exact
# version, matures out of the window by 2026-09-14T21:00Z, and is removed then; a range is never listed.
minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1131.0'
  - '@fast-check/vitest@0.5.0'
  - '@tanstack/react-router@1.170.35'
  - '@tanstack/react-virtual@3.14.12'
  - '@tanstack/virtual-core@3.17.10'
  - 'fast-check@4.10.0'
  - 'fastify@5.12.4'
  - 'lucide-react@1.45.0'
  - 'micromark-extension-gfm-table@2.1.2'
  - 'vite@8.3.0'
  - 'yaml@2.9.1'
  - 'zod@4.6.2'
trustPolicy: no-downgrade
# Exact old versions that no-downgrade flags because a later version gained provenance and these predate it.
# Every entry is a pin, never a range, and is reviewed when its dependent moves (13-decision-log.md A1).
trustPolicyExclude:
  - 'semver@5.7.2'
  - 'semver@6.3.1'
allowBuilds:
  electron: true
  lefthook: true
  '@node-rs/argon2': true
  # Transitive packages that ship install scripts the product does not need: denied explicitly so
  # pnpm 12 never prompts and a new script-bearing dependency fails the install until it is reviewed.
  cpu-features: false
  electron-winstaller: false
  msw: false
  protobufjs: false
  ssh2: false
strictPeerDependencies: true
dedupePeerDependents: true
publicHoistPattern: []

# One module instance each (A14): the whole closure resolves to the catalog version
overrides:
  yjs: 'catalog:'
  lib0: 'catalog:'
  y-protocols: 'catalog:'
  '@codemirror/state': 'catalog:'
  '@codemirror/view': 'catalog:'
