    <meta name="viewport" content="width=device-width, initial-scale=1" />

      (`CSP_NONCE_PLACEHOLDER` in apps/desktop/src/main/csp.ts and

      `reply.cspNonce`, and the Vitest Browser Mode middleware.
    -->
    <meta name="csp-nonce" content="__IRIDIUM_CSP_NONCE__" />
    <title>Iridium spike S04 — CodeMirror under a nonce-only style policy</title>
    <link rel="stylesheet" href="./static.css" />
    <link rel="stylesheet" href="./hljs.css" />
