name: Prepare multi-platform release Docker
description: Uses the containerd image store so both platforms of one immutable index can execute.

runs:
  using: composite
  steps:
    # The hosted runner's classic store cannot load both platforms under the same index digest.
    - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
      with:
        version: v29.8.1
        daemon-config: |
          {"features":{"containerd-snapshotter":true}}
    - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
