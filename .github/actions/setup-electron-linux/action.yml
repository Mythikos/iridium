name: Prepare sandboxed Electron on Linux
description: Installs native libraries and the pinned Electron sandbox helper on the disposable runner.

runs:
  using: composite
  steps:
    - name: Install native libraries
      shell: bash
      run: pnpm exec playwright install-deps chromium

    - name: Install the sandbox helper
      shell: bash
      run: |
        set -euo pipefail
        # Electron 44 downloads lazily and writes progress to stdout on its first require.
        pnpm --filter @iridium/desktop exec node -e 'require("electron")'
        helper="$(pnpm --filter @iridium/desktop exec node -p 'require("node:path").join(require("node:path").dirname(require("electron")), "chrome-sandbox")')"
        # Match this Electron build, keep the helper outside the writable checkout, and retain
        # chromiumSandbox: true. Ubuntu's restricted user namespaces require this fallback.
        sudo install -o root -g root -m 4755 "$helper" /usr/local/sbin/iridium-chrome-sandbox
        # This release build resolves the helper beside Electron rather than consulting the
        # development-only CHROME_DEVEL_SANDBOX override.
        ln -sfn /usr/local/sbin/iridium-chrome-sandbox "$helper"
