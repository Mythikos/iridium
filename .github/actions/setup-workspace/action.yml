# Shared workspace setup for every job of every Iridium workflow.
#
# It exists so the three `uses:` digests below are pinned in exactly one place: a job that
# repeats them is a job that will one day disagree with the others about which pnpm or Node
# it runs. Renovate's `helpers:pinGitHubActionDigests` (renovate.json) updates composite
# actions as well as workflows, so the pins here are maintained with the rest.
#
# `actions/checkout` is deliberately NOT here: a local action cannot run before the
# repository that contains it has been checked out, so every job checks out first.
name: Set up the Iridium workspace
description: >-
  Installs the pinned pnpm (from `packageManager`) and the pinned Node (from `.node-version`),
  then installs the workspace from the frozen lockfile.

inputs:
  node-version:
    description: >-
      Node major or exact version to use instead of the `.node-version` pin. Only the
      forward-compatibility lanes set it; every other job runs the pinned runtime.
    required: false
    default: ''
  install:
    description: Install the workspace with `pnpm install --frozen-lockfile`.
    required: false
    default: 'true'
  install-args:
    description: Extra arguments appended to `pnpm install --frozen-lockfile`.
    required: false
    default: ''
  playwright-browsers:
    description: >-
      Playwright browsers to install, as the argument list for `playwright install`
      (for example `chromium` or `--with-deps chromium`). Empty installs nothing.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # No `version:` input: pnpm/action-setup reads the root `packageManager` field
    # (pnpm@12.4.1), and passing both is an error.
    - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

    # pnpm must be on PATH before `cache: pnpm` can resolve the store directory.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.node-version' || '' }}
        cache: pnpm

    # CURRENT is the last exited milestone. M1 is in progress; future CURRENT values must
    # advance the default, and a dispatch may advance it further but never suppress due gates.
    - name: Resolve the test milestone
      shell: bash
      env:
        IRIDIUM_REQUESTED_TEST_MILESTONE: ${{ github.event.inputs.milestone_exit }}
      run: |
        node --input-type=commonjs <<'NODE'
        const { appendFileSync, readFileSync } = require('node:fs');
        const current = readFileSync('docs/milestones/CURRENT', 'utf8').trim();
        const requested = process.env.IRIDIUM_TEST_TARGET_MILESTONE || process.env.IRIDIUM_REQUESTED_TEST_MILESTONE;
        const index = (value) => {
          if (!/^M[0-8]$/.test(value)) throw new Error(`Invalid milestone: ${value}`);
          return Number(value.slice(1));
        };
        const target = requested && requested !== 'none' ? requested : `M${Math.max(1, index(current))}`;
        if (index(target) < index(current)) throw new Error(`Test target ${target} precedes CURRENT ${current}`);
        appendFileSync(process.env.GITHUB_ENV, `IRIDIUM_TEST_TARGET_MILESTONE=${target}\n`);
        NODE

    - name: Install the workspace
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile ${{ inputs.install-args }}

    - name: Install Playwright browsers
      if: inputs.playwright-browsers != ''
      shell: bash
      run: pnpm exec playwright install ${{ inputs.playwright-browsers }}
